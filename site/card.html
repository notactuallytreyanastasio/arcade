<!doctype html>
<!-- The social card, 1200 x 630. Not deployed: `scripts/pages.sh shot`
     renders this page to site/card.png, which is. It shows putt.png, so the
     card is retaken with the screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>arcade: social card</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    grid-template-columns: 1fr 420px;
    background: #1b2a22;
    color: #f5f5f0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .words { padding: 84px 0 0 80px; }
  .mark {
    font: 700 44px/1 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  .mark::before {
    content: "";
    display: inline-block;
    width: 28px;
    height: 28px;
    margin-right: 20px;
    border-radius: 50%;
    background: #3f9b4a;
  }
  h1 {
    margin: 56px 0 0;
    max-width: 600px;
    font-size: 62px;
    line-height: 1.08;
    letter-spacing: -0.02em;
  }
  p {
    margin: 44px 0 0;
    font: 23px/1.3 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color: #a6b8ab;
  }
  .shot {
    align-self: start;
    margin: 56px 0 0 0;
    width: 316px;
    border: 8px solid #7a4b2a;
    border-radius: 24px;
    overflow: hidden;
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="words">
    <div class="mark">arcade</div>
    <h1>A game engine for March games in the browser.</h1>
    <p>pure core &middot; thin JS shell &middot; a playable demo</p>
  </div>
  <div class="shot"><img src="putt.png" alt=""></div>
</body>
</html>
